name: Sync OneShot 0.3.2

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sync-oneshot-032.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed OneShot release
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-9c88-8206-9768-1fe9093c4cae/raw?se=2026-09-20T12%3A39%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=d4a01786-119e-5bd4-8786-ce694d629aa6&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T02%3A24%3A26Z&ske=2026-09-21T02%3A24%3A26Z&sks=b&skv=2026-02-06&sig=K6LOqjcfNs2f6ePMSOjfiMlxnU6UYBtteHxuyR7ykvo%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/oneshot.zip
          mkdir -p OneShot
          unzip -jo /tmp/oneshot.zip "OneShot.apk" "update.json" -d OneShot
          test -s OneShot/OneShot.apk
          test -s OneShot/update.json

      - name: Commit update files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OneShot/OneShot.apk OneShot/update.json
          git commit -m "publish OneShot 0.3.2 stable rollback"
          git push
