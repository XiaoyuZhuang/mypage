name: Sync OneShot 0.3.4

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sync-oneshot-034.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed OneShot release
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-16bc-81fb-87b1-d33ec3e6d81e/raw?se=2026-09-20T13%3A00%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=a9d05346-1e14-5083-a722-a2bf450812d4&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T03%3A24%3A00Z&ske=2026-09-21T03%3A24%3A00Z&sks=b&skv=2026-02-06&sig=44IpVvfPSjUGfWLCz7uxBkhKGT/TQWXSWJ66X0odIbE%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/oneshot.zip
          mkdir -p OneShot
          unzip -jo /tmp/oneshot.zip "OneShot.apk" -d OneShot
          test -s OneShot/OneShot.apk

          cat > OneShot/update.json <<'EOF'
          {
            "versionCode": 8,
            "versionName": "0.3.4",
            "apkUrl": "https://raw.githubusercontent.com/XiaoyuZhuang/mypage/main/OneShot/OneShot.apk",
            "notes": "增强荣耀 0.6× 诊断：枚举 vendor Camera2 keys，并只读探测隐藏 Camera ID 2–5；更新页增加下载百分比和浏览器直接下载最新版 APK 按钮。主相机继续使用稳定 CameraX。"
          }
          EOF

      - name: Commit update files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OneShot/OneShot.apk OneShot/update.json
          git commit -m "publish OneShot 0.3.4"
          git push
