name: Sync OneShot 0.3.3

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sync-oneshot-033.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed OneShot release
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-ab78-81fd-98c3-42ff5ca832b1/raw?se=2026-09-20T12%3A52%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=f2014303-17ca-5984-b1a7-e42ed3692bf9&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T08%3A11%3A10Z&ske=2026-09-21T08%3A11%3A10Z&sks=b&skv=2026-02-06&sig=nuN8TTmXpvamtVvdp5DA6wMrtDxwAn5yb7j4c//VcT0%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/oneshot.zip
          mkdir -p OneShot
          unzip -jo /tmp/oneshot.zip "OneShot.apk" -d OneShot
          test -s OneShot/OneShot.apk

          cat > OneShot/update.json <<'EOF'
          {
            "versionCode": 7,
            "versionName": "0.3.3",
            "apkUrl": "https://raw.githubusercontent.com/XiaoyuZhuang/mypage/main/OneShot/OneShot.apk",
            "notes": "新增 1–120 fps 自定义预览刷新率；设置页避开状态栏；新增 0.6× Camera2 logical/physical 自动诊断与可复制错误报告；新增本地崩溃记录。主相机继续使用稳定 CameraX。"
          }
          EOF

      - name: Commit update files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OneShot/OneShot.apk OneShot/update.json
          git commit -m "publish OneShot 0.3.3"
          git push
