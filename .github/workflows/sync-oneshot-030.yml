name: Sync OneShot 0.3.0

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sync-oneshot-030.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed OneShot release
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-17f0-8211-bdd7-281dfeeb9b5c/raw?se=2026-09-20T12%3A19%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=e86f2e30-d88d-55c4-b8bd-efb572d9279a&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T06%3A06%3A06Z&ske=2026-09-21T06%3A06%3A06Z&sks=b&skv=2026-02-06&sig=dDVQX4/BzNAAKEdoyoi8aJ1MkXsdXR63iMoHsCKqMZo%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/oneshot.zip
          mkdir -p OneShot
          unzip -jo /tmp/oneshot.zip "OneShot.apk" "update.json" -d OneShot
          test -s OneShot/OneShot.apk
          test -s OneShot/update.json
          ls -lh OneShot/OneShot.apk OneShot/update.json

      - name: Commit update files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OneShot/OneShot.apk OneShot/update.json
          git commit -m "publish OneShot 0.3.0"
          git push
