name: Sync OneShot 0.3.5

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sync-oneshot-035.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed OneShot release
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-b2e8-8206-8f5e-8e1a8af09960/raw?se=2026-09-20T13%3A07%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=77be4821-3b39-5c70-ae94-415949956d6d&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T12%3A42%3A33Z&ske=2026-09-21T12%3A42%3A33Z&sks=b&skv=2026-02-06&sig=axpQuWqreRdbeLNUaT/fSTb1kUc0PbQDRntnCU0ptTc%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/oneshot.zip
          mkdir -p OneShot
          unzip -jo /tmp/oneshot.zip "OneShot.apk" -d OneShot
          test -s OneShot/OneShot.apk

          cat > OneShot/update.json <<'EOF'
          {
            "versionCode": 9,
            "versionName": "0.3.5",
            "apkUrl": "https://raw.githubusercontent.com/XiaoyuZhuang/mypage/main/OneShot/OneShot.apk",
            "notes": "新增荣耀隐藏镜头实时测试：ID 3 超广角、ID 2@0.6×、ID 4 长焦，均带 Camera2 实时预览和可复制错误报告；主相机仍保持稳定 CameraX。"
          }
          EOF

      - name: Commit update files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OneShot/OneShot.apk OneShot/update.json
          git commit -m "publish OneShot 0.3.5"
          git push
